# Cross build: aarch64 Linux target (desktop ARM). Standalone; the Android
# path is android/ (Gradle + CMake), not Meson.
#
# The full app build additionally needs target SDL3 / SDL3_ttf. Build a sysroot
# with cross/build-sdl3-aarch64.sh and point pkg-config at it:
#   cross/build-sdl3-aarch64.sh                 # ISO_ARM_SYSROOT to override
#   PKG_CONFIG_LIBDIR=$ISO_ARM_SYSROOT/lib/pkgconfig \
#       meson setup build-aarch64 --cross-file cross/aarch64.ini
# The pure suite needs no sysroot and cross-compiles regardless.
[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
